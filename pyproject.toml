[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptcg-scanner"
version = "1.0.0"
description = "Detection, cropping, and OCR for Pokémon TCG cards (bachelor thesis)."
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Sofia Valadares", email = "sofiav.cav@gmail.com" },
]
requires-python = ">=3.10"
keywords = ["pokemon", "tcg", "yolo", "obb", "ocr", "tcc"]

[project.urls]
License = "https://creativecommons.org/licenses/by-nc/4.0/"

[tool.setuptools]
packages = ["cropper", "ocr", "roi", "train", "train.common", "train.detector", "train.roi", "train.ocr"]
package-dir = {"" = "src", "train" = "train"}
